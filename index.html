<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="brand">SHADOW <span>ARENA</span></div>
      <div class="stat"><span>WAVE</span><b id="wave">1</b></div>
      <div class="stat"><span>KILLS</span><b id="kills">0</b></div>
      <div class="stat"><span>TIME</span><b id="time">00:00</b></div>
    </div>
    <div class="bars">
      <div class="bar hp"><i id="hpBar"></i></div>
      <div class="bar xp"><i id="xpBar"></i></div>
    </div>
    <div class="ability"><div class="specialLabel">SPECIAL</div><div class="specialBar"><i id="specialBar"></i></div></div>
  </div>

  <div id="message"></div>

  <div id="startScreen" class="screen">
    <div class="logo">SHADOW<br><span>ARENA</span></div>
    <p>ENDLESS SURVIVAL</p>
    <button id="startBtn">ENTER THE ARENA</button>
    <small>WASD / ARROWS · MOUSE AIM · CLICK ATTACK · SPACE DASH · Q SPECIAL</small>
  </div>

  <div id="upgradeScreen" class="screen hidden">
    <h2>LEVEL UP</h2>
    <p>Choose an upgrade</p>
    <div id="upgradeChoices"></div>
  </div>

  <div id="gameOver" class="screen hidden">
    <h2>DEFEATED</h2>
    <div class="results">
      <div><span>WAVE</span><b id="finalWave">1</b></div>
      <div><span>KILLS</span><b id="finalKills">0</b></div>
      <div><span>SURVIVED</span><b id="finalTime">00:00</b></div>
    </div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>

  <div id="touchControls">
    <div id="stick"><div id="knob"></div></div>
    <div class="touchRight">
      <button id="dashBtn">DASH</button>
      <button id="specialBtn">Q</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
